<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 🧠 다마AI: 분석·추적 코드 없음 — 대화도 데이터도 밖으로 나가지 않습니다 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드보라의 다마AI — 나만의 인공지능 펫</title>
    <meta name="description" content="내 컴퓨터의 로컬 AI를 연결해 알에서 깨우고, 가르치며 키우는 교육용 가상 펫 게임">
    <link rel="apple-touch-icon" sizes="57x57" href="apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192"  href="android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-TileImage" content="ms-icon-144x144.png">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="theme-default">
    <div class="background"></div>
    <!-- main -->
    <div class="root">
        <!-- canvas -->
        <canvas class="background-canvas" width="96" height="96"></canvas>
        <!-- bg overlay -->
        <div class="bg-pattern"></div>
        <!-- dom shell -->

        <!-- loading text -->
        <div class="loading-text">
            <div class="loading-logo blink logo-text">다마AI</div>
            <b id="loading-error"style="font-size: small;"></b>
            <i class="fa-solid fa-circle-notch fa-spin loading-spinner"></i>
        </div>

        <!-- error -->
         <div class="error-container" style="display: none;">
            <i class="fa-solid fa-warning"></i>
            <span id="error-message"></span>
            <div onclick="document.querySelector('.error-container').style.display = 'none'" class="close flex-center cursor-pointer">
                <i class="fa-solid fa-times"></i>
            </div>
         </div>

        <div class="dom-shell" style="display: none;">
            <div class="logo logo-text">다마AI</div>
            <button class="shell-btn main mute" onclick="App.handlers.shell_button(1)"></button>
            <button class="shell-btn left mute" onclick="App.handlers.shell_button(0)"></button>
            <button class="shell-btn right mute" onclick="App.handlers.shell_button(2)"></button>
        </div>
        <!-- graphics -->
        <div class="graphics-wrapper">
            <!-- save indicator -->
            <div style="display: none;" class="save-indicator">
                <i class="fa-solid fa-save fa-spin_"></i>
            </div>
            <!-- screen wrapper -->
            <div class="screen-wrapper">
                <!-- canvas -->
                <canvas style="cursor: pointer;" onclick="App.handlers.open_main_menu();" class="graphics-canvas" width="96" height="96"></canvas>

                <!-- tapping reminder -->
                <div class="full-device-overlay tap-reminder" style="display: none;">
                    <img src="resources/img/ui/tap_01.png"></img>
                </div>

                <!-- screenshot overlay -->
                <div class="full-device-overlay screenshot-overlay" style="display: none;">
                    <img class="width-full" src="resources/img/ui/screenshot_overlay.png"></img>
                </div>

                <!-- phone call notification -->
                <div style="display: none;" class="ringing-phone flex flex-center fa-shake">
                    <img src="resources/img/ui/mobile-phone.png">
                </div>
            </div>
        </div>
    </div>

    <!-- downloading -->
    <div style="display: none;" id="download-container" class="side-container">
        <div class="side-icon">
            <i class="fa-solid fa-arrow-down"></i>
        </div>
        <span> Downloading update... </span>
    </div>

    <!-- download complete -->
    <div style="display: none;" id="download-complete-container" class="side-container">
        <div class="side-icon">
            <i class="fa-solid fa-check"></i>
        </div>
        <span> Download complete! <a href="">Refresh</a> </span>
    </div>

    <!-- cloneables -->
    <div style="display: none;" class="cloneables">
        <div class="post-container display" style="display: none;">
            <canvas width="96" height="96" class="post-canvas"></canvas>
            <div class="post-text">Post Bottom Text</div>
            <div class="post-header">Post Header</div>
            <div class="post-profile-icon"></div>
            <button class="post-close back-btn"><i class="fa-solid fa-times"></i></button>
            <button data-fb-keep-index class="post-next"><i class="fa-solid fa-angle-right"></i></button>
            <button class="post-like"><i class="fa-solid fa-heart"></i></button>
        </div>

        <div class="generic-list-container display menu-animation"></div>

        <div class="generic-slider-container display">
            <div class="main-container">
                <button class="slide-action mute generic-btn stylized slide-left flex-center"> <i class="fa-solid fa-angle-left"></i> </button>
                <div class="content surface-stylized"></div>
                <button class="slide-action mute generic-btn stylized slide-right flex-center"> <i class="fa-solid fa-angle-right"></i> </button>
                
                <!-- remove later -->
                <div style="display: none;" class="additional-text surface-stylized"></div> 
                
                <div class="top-slot left surface-stylized"></div>
                <div class="top-slot right surface-stylized"></div>
            </div>
            <div class="actions-container">
                <button id="cancel-btn" class="generic-btn stylized back-btn">CANCEL</button>
                <button data-fb-keep-index id="accept-btn" class="generic-btn stylized">ACCEPT</button>
            </div>
        </div>

        <div class="generic-list-container generic-grid-container display menu-animation"></div>

        <div class="generic-empty-container display menu-animation"></div>

        <div class="generic-empty-container display webcam-container">
            <video class="webcam-video"></video>
            <button style="display: none;" id="webcam-button"></button>
            <button id="webcam-change-button">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
            <canvas style="display: none;" id="webcam-canvas"></canvas>
        </div>

        <div class="progressbar">
            <div class="progressbar-background">
                <div class="progressbar-rod">
    
                </div>
            </div>
        </div>
    </div>

    <!-- install prompt (unused) -->
    <div class="install-prompt" style="display: none;">
        <img class="app-icon" src="./android-icon-36x36.png"></img>
        <button id="install-pwa-app">Add to home screen</button>
    </div>

    <!-- data & resources -->
    <script src="resources/data/SpriteDefinitions.js"></script>
    <script src="resources/data/CharacterDefinitions.js"></script>
    <script src="resources/data/SoundDefinitions.js"></script>
    <script src="resources/data/GrowthChart.js"></script>

    <!-- libs -->
    <script src="src/libs/profanity-cleaner-0.0.3.js"></script>
    <script src="src/libs/moment.js"></script>
    <script src="src/libs/idb-keyval.js"></script>
    <script src="src/Migrate.js"></script>
    
    <!-- 만든 사람들·원작 크레딧: 게임 안 크레딧 화면(⚙️→credits)에 표기 -->

    <!-- scripts -->
    <script src="src/Version.js"></script>
    <script src="src/UiHelper.js"></script>
    <script src="src/Branding.js"></script>
    <script src="src/LocalAI.js"></script>
    <script src="src/AIGrowth.js"></script>
    <script src="src/Utils.js"></script>
    <script src="src/Drawer.js"></script>
    <script src="src/Object2d.js"></script>
    <script src="src/Scene.js"></script>
    <script src="src/Activities.js"></script>
    <script src="src/PetDefinition.js"></script>
    <script src="src/Pet.js"></script>
    <script src="src/Animal.js"></script>
    <script src="src/Plant.js"></script>
    <script src="src/App.js"></script>
    <script src="src/Definitions.js"></script>
    <script src="src/Missions.js"></script>
    <script defer src="src/StoryGen.js"></script>
    <script src="src/Main.js"></script>

  <!-- 🧠 로컬 AI — 게임 메인 메뉴의 🧠 아이콘으로 통합됨 (LocalAIUi.js) -->
  <script src="src/LocalAIUi.js"></script>

  <!-- 원작 크레딧은 게임 내 크레딧 화면(⚙️→credits)과 README·FORK_NOTICE에 표기 -->
</body>
</html>
